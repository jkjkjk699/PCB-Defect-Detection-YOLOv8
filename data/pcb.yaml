# PCB 缺陷检测数据集配置
# 使用前请把 path 改为你本机数据集的实际路径（绝对路径或相对本文件的路径）
# 数据集需从 Roboflow 下载 YOLOv8 格式，目录结构应为：
#   path/
#     ├── train/images  path/train/labels
#     ├── valid/images  path/valid/labels
#     └── test/images   path/test/labels

path: ../datasets/pcb_defect   # 数据集根目录
train: train/images
val: valid/images
test: test/images

# 7 类缺陷
names:
  0: Short_circuit
  1: damaged
  2: lack_of_part
  3: miss_welding
  4: redundant
  5: slug
  6: spillover
